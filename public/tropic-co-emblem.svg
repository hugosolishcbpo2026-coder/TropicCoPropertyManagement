<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8efcd"/>
      <stop offset="45%" stop-color="#dbac3b"/>
      <stop offset="100%" stop-color="#7d5320"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1eb775"/>
      <stop offset="100%" stop-color="#0a3326"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer diamond frame -->
  <path d="M100 14 L180 100 L100 186 L20 100 Z" stroke="url(#gold)" stroke-width="1.2" opacity="0.5"/>

  <!-- Inner filled diamond -->
  <path d="M100 38 L162 100 L100 162 L38 100 Z" fill="url(#gold)" filter="url(#glow)"/>

  <!-- Facet lines -->
  <path d="M100 38 L100 162" stroke="#050d10" stroke-width="0.8" opacity="0.35"/>
  <path d="M38 100 L162 100" stroke="#050d10" stroke-width="0.8" opacity="0.35"/>
  <path d="M68 68 L132 132" stroke="#050d10" stroke-width="0.55" opacity="0.22"/>
  <path d="M132 68 L68 132" stroke="#050d10" stroke-width="0.55" opacity="0.22"/>

  <!-- Palm fronds -->
  <g stroke="url(#emerald)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M100 100 C 86 84, 76 72, 62 58"/>
    <path d="M100 100 C 114 84, 124 72, 138 58"/>
    <path d="M100 100 C 90 80, 86 64, 84 42"/>
    <path d="M100 100 C 110 80, 114 64, 116 42"/>
    <path d="M100 100 L 100 46"/>
  </g>

  <!-- Center jewel -->
  <circle cx="100" cy="100" r="3.5" fill="#f5f1e8"/>
  <circle cx="100" cy="100" r="1.4" fill="#dbac3b"/>
</svg>
